name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            qt_arch: ''
            qt_version: '6.7.0'
          - os: ubuntu-22.04
            qt_arch: ''
            qt_version: '6.7.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          setup-python: false

      - name: Setup Build Tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-xcb1 \
            libxrender1 \
            libxi6 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Build project (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }
          New-Item -ItemType Directory -Path "build"
          Set-Location build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt"
          cmake --build . --config Release

      - name: Build project (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          if [ -d "build" ]; then
            rm -rf build
          fi
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt"
          cmake --build . --config Release

      - name: Deploy Qt dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          windeployqt --release --no-translations --no-system-d3d-compiler Chess960.exe

      - name: Deploy Qt dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd build
          mkdir -p lib
          mkdir -p platforms
          
          ldd Chess960 | grep "=>" | awk '{print $3}' | grep -v "^$" | while read lib; do
            if [ -f "$lib" ]; then
              cp -v "$lib" lib/ 2>/dev/null || true
            fi
          done
          
          find ${{ github.workspace }}/Qt -name "libqxcb.so" -exec cp {} platforms/ \; 2>/dev/null || true
          
          cat > run.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$DIR/platforms:$LD_LIBRARY_PATH"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$DIR/platforms"
          export QT_QPA_PLATFORM=xcb
          exec "$DIR/Chess960" "$@"
          EOF
          chmod +x run.sh

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          Compress-Archive -Path ./* -DestinationPath ../../Chess960_${{ github.ref_name }}_Windows.zip

      - name: Create Archive (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd build
          tar -czf ../Chess960_${{ github.ref_name }}_Linux.tar.gz Chess960 run.sh lib/ platforms/

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: Chess960_${{ github.ref_name }}_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: Chess960_${{ github.ref_name }}_Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}