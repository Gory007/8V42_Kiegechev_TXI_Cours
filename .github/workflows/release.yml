name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'
          cache: 'true'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build project
        run: |
          # Очищаем старую папку build
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }
          mkdir build
          cd build
          # Используем генератор Ninja
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Deploy Qt dependencies
        run: |
          cd build
          # Копируем Qt DLL и другие зависимости
          windeployqt --release --no-translations Chess960.exe

      - name: Create ZIP archive
        run: |
          cd build
          Compress-Archive -Path ./* -DestinationPath ../../Chess960_${{ github.ref_name }}.zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Chess960_${{ github.ref_name }}.zip
          asset_name: Chess960_${{ github.ref_name }}.zip
          asset_content_type: application/zip